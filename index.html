<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Instagram.com</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <nav class="navbar">
    <div class="logo">Instagram</div>
    <input type="text" placeholder="Search" class="search-input" />
    <div class="icons">
      <span>🏠</span>
      <span>➕</span>
      <span>❤️</span>
      <span>👤</span>
    </div>
  </nav>

  <section class="stories">
    <div class="story">You</div>
    <div class="story">Friend 1</div>
    <div class="story">Friend 2</div>
    <div class="story">Friend 3</div>
  </section>

  <main class="feed">
    <div class="post">
      <div class="post-header">
        <div class="profile-pic">👤</div>
        <span class="username">cristiano</span>
      </div>
      <img src="https://via.placeholder.com/500" alt="Post" class="post-img" />
      <div class="post-actions">
        <span class="like-btn">❤️</span>
        <span class="comment-btn">💬</span>
        <span class="share-btn">📤</span>
      </div>
      <div class="likes">Liked by <strong>450</strong> people</div>
      <div class="caption">
        <strong>cristiano</strong> Great match today ⚽🔥
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
